<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InovaTech - Gestão Educacional</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos Globais -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white overflow-hidden">

    <!-- 1. TELA DE CARREGAMENTO (LOADING) -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loading-text" class="text-slate-600 font-medium animate-pulse">Conectando ao sistema...</p>
    </div>

    <!-- 2. TELA DE LOGIN -->
    <div id="login-screen" class="hidden fixed inset-0 bg-slate-100 z-40 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 fade-in">
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-md">IT</div>
                <h1 class="text-2xl font-extrabold text-slate-800">InovaTech</h1>
            </div>
            <p class="text-center text-slate-500 text-sm mb-6">Acesse o painel de gestão pedagógica</p>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail</label>
                    <input type="email" id="email-input" placeholder="seu.email@exemplo.com" class="w-full border border-slate-300 p-3 rounded-lg outline-none focus:border-blue-500 transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label>
                    <input type="password" id="password-input" placeholder="••••••••" class="w-full border border-slate-300 p-3 rounded-lg outline-none focus:border-blue-500 transition" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md">Entrar com E-mail</button>
            </form>

            <div class="mt-3 text-center">
                <button type="button" id="btn-primeiro-acesso" class="text-xs text-blue-600 hover:underline font-semibold">Primeiro acesso? Solicite seu credenciamento aqui</button>
            </div>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase font-bold">ou</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button type="button" id="btn-google-login" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 border border-slate-300 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
                </svg>
                Entrar com Google
            </button>
        </div>
    </div>

    <!-- Container para Modais Globais de Usuários (Pré-Cadastro) -->
    <div id="usuarios-modal-root"></div>

    <!-- 3. CONTAINER PRINCIPAL DA SPA -->
    <div id="app-root" class="hidden h-screen w-screen overflow-hidden flex flex-col md:flex-row"></div>

    <!-- ========================================== -->
    <!-- SCRIPTS DO SISTEMA                         -->
    <!-- ========================================== -->

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuração Firebase e Núcleo Base -->
    <script src="./firebase-config.js"></script>
    <script src="./util.js"></script>
    <script src="./dialog.js"></script>
    <script src="./controller.js"></script>
    <script src="./views.js"></script>

    <!-- Módulo: Usuários e Pré-Cadastro (./usuarios) -->
    <script src="./usuarios/controller_usuarios.js"></script>
    <script src="./usuarios/views_usuarios.js"></script>
    <script src="./usuarios/app_usuarios.js"></script>

    <!-- Módulo: Calendário e Exceções - Dividido em Listar e Frms (./calendario) -->
    <script src="./calendario/controller_calendario_frms.js"></script>
    <script src="./calendario/views_calendario_frms.js"></script>
    <script src="./calendario/app_calendario_frms.js"></script>
    <script src="./calendario/controller_calendario_listar.js"></script>
    <script src="./calendario/views_calendario_listar.js"></script>
    <script src="./calendario/app_calendario_listar.js"></script>

    <!-- Módulo: Cursos e UCs - Dividido em Listar e Frm (./cursos) -->
    <script src="./cursos/controller_curso_frm.js"></script>
    <script src="./cursos/views_curso_frm.js"></script>
    <script src="./cursos/app_curso_frm.js"></script>
    <script src="./cursos/controller_curso_listar.js"></script>
    <script src="./cursos/views_curso_listar.js"></script>
    <script src="./cursos/app_curso_listar.js"></script>

    <!-- Módulo: Turmas - Dividido em Listar e Frm (./turmas) -->
    <script src="./turmas/controller_turma_frm.js"></script>
    <script src="./turmas/views_turma_frm.js"></script>
    <script src="./turmas/app_turma_frm.js"></script>
    <script src="./turmas/controller_turma_listar.js"></script>
    <script src="./turmas/views_turma_listar.js"></script>
    <script src="./turmas/app_turma_listar.js"></script>

    <!-- Módulo: Painel Admin - Aba Credenciamento (./admin) -->
    <script src="./admin/controller_admin_credenciamento.js"></script>
    <script src="./admin/views_admin_credenciamento.js"></script>
    <script src="./admin/app_admin_credenciamento.js"></script>

    <!-- Módulo: Espelho de Classe / Mapa de Aulas -->
    <script src="./espelho/controller_espelho_mapa.js"></script>
    <script src="./espelho/controller_espelho_validacoes.js"></script>
    <script src="./espelho/controller_espelho_horas.js"></script>
    <script src="./espelho/controller_espelho_persistencia.js"></script>
    <script src="./espelho/controller_espelho_excecoes.js"></script>
    <script src="./espelho/controller_espelho_recursos.js"></script>
    <script src="./espelho/views_espelho_mapa.js"></script>
    <script src="./espelho/views_espelho_modais.js"></script>
    <script src="./espelho/views_espelho_filtro.js"></script>
    <script src="./espelho/views_espelho_recursos.js"></script>
    <script src="./espelho/app_espelho_core.js"></script>
    <script src="./espelho/app_espelho_calculos.js"></script>
    <script src="./espelho/app_espelho_filtros.js"></script>
    <script src="./espelho/app_espelho_progresso.js"></script>
    <script src="./espelho/app_espelho_filtro.js"></script>
    <script src="./espelho/app_espelho_mapa.js"></script>
    <script src="./espelho/app_espelho_distribuicao.js"></script>
    <script src="./espelho/app_espelho_lote.js"></script>
    <script src="./espelho/app_espelho_movimentacao.js"></script>
    <script src="./espelho/app_espelho_recursos.js"></script>

    <!-- Orquestrador Global (Sempre por último) -->
    <script src="./app.js"></script>
</body>
</html>
