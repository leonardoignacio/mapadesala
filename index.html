<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InovaTech - Planejamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

    <!-- Loading Global -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-semibold text-slate-500" id="loading-text">Conectando ao sistema...</p>
    </div>

    <!-- Tela de Login -->
    <div id="login-screen" class="fixed inset-0 bg-slate-50 z-40 hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">InovaTech Login</h1>
            <form id="login-form" class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-semibold mb-1">E-mail</label>
                    <input type="email" id="email-input" class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Senha</label>
                    <input type="password" id="password-input" class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500" required>
                </div>
                <div class="flex flex-col gap-2 mt-2">
                    <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg transition">Entrar</button>
                    <button type="button" id="btn-primeiro-acesso" class="w-full bg-blue-50 text-blue-700 font-bold py-2 rounded-lg border border-blue-200 hover:bg-blue-100 transition">Primeiro Acesso</button>
                </div>
            </form>
            <div class="relative flex items-center py-2 mb-6">
                <div class="flex-grow border-t border-slate-300"></div>
                <span class="mx-4 text-slate-400 text-sm">Acesso Admin</span>
                <div class="flex-grow border-t border-slate-300"></div>
            </div>
            <button id="btn-google-login" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-2 rounded-lg transition">
                Autenticar com Google (Superusuário)
            </button>
        </div>
    </div>

    <!-- SPA Root -->
    <main id="app-root" class="flex-1 flex hidden"></main>

    <!-- Scripts Firebase v8 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Lógica Modular -->
    <script src="firebase-config.js"></script>
    <script src="controller.js"></script>
    <script src="views.js"></script>
    <script src="app.js"></script>
</body>
</html>
